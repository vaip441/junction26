<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Terminal debug page</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
  #price { font-size: 40px; font-variant-numeric: tabular-nums; }
  form { display: flex; gap: 8px; margin: 12px 0; } input { flex: 1; padding: 8px; font: inherit; }
  li { margin: 6px 0; } .up { color: #1565c0; } .down { color: #b3541e; } .none { color: #666; } small { color: #666; }
</style>
<h1>Terminal debug page</h1>
<p>Not the real screen. It shows that ticks flow from the pipeline to the stream.</p>
<form id="add"><input id="query" placeholder="Ask a question, or paste a Kalshi or Polymarket link" maxlength="500" required><button>Track</button></form>
<p id="status" role="status"></p>
<label>Market <select id="market"></select></label> <button id="delete" type="button">Delete this market</button>
<div id="price">–</div>
<form id="form"><input id="text" placeholder="Type a sentence or headline" maxlength="500" required><button>Send as tick</button></form>
<p id="error" role="alert"></p>
<h2>Why did it move? <button id="why" type="button">Explain today's move</button></h2>
<ul id="moves"></ul>
<h2>Tape</h2>
<ul id="tape"></ul>
<script>
const $ = id => document.getElementById(id);
// The write key (TERMINAL_KEY in .env) is asked for once and kept in this browser.
let KEY = new URLSearchParams(location.search).get("key") || localStorage.getItem("terminalKey") || "";
let current = null;
const pct = p => p == null ? "–" : p.toFixed(1) + "%";
function row(t) {
  const li = document.createElement("li");
  const label = {up: "Up", down: "Down", none: "No effect"}[t.verdict];
  const b = document.createElement("b"); b.className = t.verdict;
  b.textContent = `${label} ${Math.round(t.confidence * 100)}% (strength ${t.strength.toFixed(2)})`;
  const s = document.createElement("small");
  // when it was published, where known; otherwise when the terminal found it
  const when = t.published_ts ? "published " + new Date(t.published_ts * 1000).toLocaleString()
                              : "found " + new Date(t.ts * 1000).toLocaleTimeString();
  const reach = t.likes == null ? "" : ` · ${t.likes} likes, ${t.replies} replies`;
  s.textContent = ` ${when} · ${t.source}${reach}${t.test ? " · test" : ""}${t.backfill ? " · backfill" : ""}`;
  li.append(b, s, document.createElement("br"), document.createTextNode(t.headline));
  if (t.rule) {  // the sentence of the market's rules that makes this tick matter
    const r = document.createElement("small");
    r.textContent = `Rule: ${t.rule.text}`;
    li.append(document.createElement("br"), r);
  }
  return li;
}
function moveRow(m) {  // a price move in one sentence; the closest news when nothing explains it
  const li = document.createElement("li");
  const b = document.createElement("b"); b.className = m.to > m.from ? "up" : "down";
  b.textContent = `${pct(m.from)} → ${pct(m.to)}`;
  li.append(b, document.createTextNode(" " + m.summary));
  const extra = m.rule ? `Rule: ${m.rule.text}` : m.closest ? `Closest news: ${m.closest.source}: ${m.closest.headline}` : "";
  if (extra) { const r = document.createElement("small"); r.textContent = extra; li.append(document.createElement("br"), r); }
  return li;
}
async function load() {
  const markets = await (await fetch("/markets")).json();
  $("market").replaceChildren(...markets.map(m => new Option(`${m.title} (${pct(m.price)})`, m.id)));
  if (current) $("market").value = current;
  current = $("market").value;
  $("price").textContent = pct(markets.find(m => m.id === current)?.price);
  const ticks = await (await fetch(`/markets/${current}/ticks?limit=50`)).json();
  $("tape").replaceChildren(...ticks.map(row));
  const moves = await (await fetch(`/markets/${current}/moves?limit=5`)).json();
  $("moves").replaceChildren(...moves.map(moveRow));
}
$("market").onchange = () => { current = $("market").value; load(); };
$("why").onclick = async () => {  // the answer also arrives as a move event
  $("status").textContent = "Working out why it moved…";
  const r = await post(`/markets/${current}/why`, {});
  $("status").textContent = r.ok ? "" : (await r.json()).detail;
};
// POST with the write key; asks for the key once if the server refuses.
async function post(path, body) {
  const send = () => fetch(path, {method: "POST", headers: {"content-type": "application/json", "X-Terminal-Key": KEY},
    body: JSON.stringify(body)});
  let r = await send();
  if (r.status === 401) {
    KEY = (prompt("Write key (TERMINAL_KEY from the .env file on the server)") || "").trim();
    r = await send();
    if (r.ok) localStorage.setItem("terminalKey", KEY);
  }
  $("error").textContent = r.ok ? "" : `Error ${r.status}: ${(await r.clone().json()).detail?.toString?.() ?? ""}`;
  return r;
}
$("form").onsubmit = async e => {
  e.preventDefault();
  if ((await post(`/markets/${current}/ticks`, {text: $("text").value, kind: "typed"})).ok) $("text").value = "";
};
$("delete").onclick = async () => {
  const title = $("market").selectedOptions[0]?.text;
  if (!current || !confirm(`Delete "${title}" with its ticks and prices?`)) return;
  let r = await fetch(`/markets/${current}`, {method: "DELETE", headers: {"X-Terminal-Key": KEY}});
  if (r.status === 401) {
    KEY = (prompt("Write key (TERMINAL_KEY from the .env file on the server)") || "").trim();
    r = await fetch(`/markets/${current}`, {method: "DELETE", headers: {"X-Terminal-Key": KEY}});
    if (r.ok) localStorage.setItem("terminalKey", KEY);
  }
  $("error").textContent = r.ok ? "" : `Error ${r.status}: ${(await r.json()).detail?.toString?.() ?? ""}`;
  if (r.ok) { current = null; load(); }
};
$("add").onsubmit = async e => {
  e.preventDefault();
  const r = await post("/markets", {query: $("query").value, poll_seconds: 300});
  if (!r.ok) return;
  const m = await r.json();
  current = m.id; $("query").value = "";
  $("status").textContent = (m.matched ? "Found on " + m.venue : "No market exists, made one up") + ": " + m.title;
  load();
};
const es = new EventSource("/stream");
es.addEventListener("tick", e => { const t = JSON.parse(e.data); if (t.market_id === current) $("tape").prepend(row(t)); });
es.addEventListener("tick_update", e => { if (JSON.parse(e.data).market_id === current) load(); });
es.addEventListener("move", e => { const m = JSON.parse(e.data); if (m.market_id === current) $("moves").prepend(moveRow(m)); });
es.addEventListener("price", e => { const p = JSON.parse(e.data); if (p.market_id === current) $("price").textContent = pct(p.price); });
es.addEventListener("market", e => {
  const m = JSON.parse(e.data);
  if (m.query) $("status").textContent = `${m.query}: ${m.status}${m.count == null ? "" : " (" + m.count + ")"}`;
  load();
});
load();
</script>
</html>
